<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCTV Designer Web</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><div><b>CCTV Designer</b><span> WEB ALPHA</span></div><div class="actions"><button id="newBtn">Nytt projekt</button><button id="undoBtn">↶ Ångra</button><button id="saveBtn">Spara</button></div></header>
<main>
<aside><h3>PROJEKT</h3><label>Namn<input id="projectName" value="Testprojekt"></label><button id="planBtn">Ladda ritning</button><input id="planFile" type="file" accept="image/*" hidden>
<h3>PLACERA</h3><div class="palette"><button data-add="camera">📷 Kamera K</button><button data-add="switch">▣ Switch</button><button data-add="nvr">▰ NVR</button></div>
<h3>SKALA</h3><p id="scaleStatus">Ej kalibrerad</p><button id="scaleBtn">Kalibrera 2 punkter</button>
<h3>STATUS</h3><p id="status">Redo.</p></aside>
<section class="stageWrap"><div id="stage"><img id="plan"><svg id="overlay"></svg><div id="empty">Ladda en ritning och placera K1, K2…</div></div></section>
<aside class="right"><h3>VALT OBJEKT</h3><div id="inspector">Välj ett objekt på ritningen.</div><h3>KAMERALISTA</h3><div id="camList"></div></aside>
</main>
<script src="app.js"></script>
</body></html>
